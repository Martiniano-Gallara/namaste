<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — Namasté Shala</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg-cream, #FAF7F2);
      color: var(--text-dark, #2C2623);
      font-family: var(--font-body, system-ui, sans-serif);
      text-align: center;
      padding: 24px;
    }
    .not-found-card {
      max-width: 480px;
      padding: 40px 32px;
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.04);
    }
    .om-icon {
      font-size: 48px;
      margin-bottom: 16px;
      color: var(--color-terracotta, #C86D51);
    }
    h1 {
      font-family: var(--font-serif, serif);
      font-size: 28px;
      margin: 0 0 12px;
      font-weight: 500;
    }
    p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    a.btn-home {
      display: inline-block;
      padding: 12px 28px;
      background: var(--color-terracotta, #C86D51);
      color: #FFFFFF;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 500;
      transition: opacity 0.2s ease;
    }
    a.btn-home:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="not-found-card">
    <div class="om-icon">ॐ</div>
    <h1>Espacio No Encontrado</h1>
    <p>El camino que buscas no existe o se encuentra reservado. Te invitamos a regresar al centro de nuestra comunidad.</p>
    <a href="/" class="btn-home">Regresar al Shala</a>
  </div>
</body>
</html>
